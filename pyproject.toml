[project]
name = "autoapply"
version = "1.0.0"
description = "Automated job application tool with AI-powered resume tailoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "playwright>=1.40.0",
    "notion-client>=2.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "reportlab>=4.0.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.0",
    "tenacity>=8.2.0",
    "flask>=3.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    # Optional: LLM-powered browser automation
    "browser-use>=0.1.0",
    "langchain-anthropic>=0.1.0",
]

[project.scripts]
autoapply = "src.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
